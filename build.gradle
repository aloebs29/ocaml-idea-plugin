import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id('java')
    id('org.jetbrains.intellij.platform') version('2.7.1') // IntelliJ Platform Gradle Plugin
}

// Configure project's dependencies
repositories {
    mavenCentral()
    // IntelliJ Platform Gradle Plugin Repositories Extension - read more: https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-repositories-extension.html
    intellijPlatform {
        defaultRepositories()
    }
}

java.sourceCompatibility = 21.0

// Dependencies are managed with Gradle version catalog - read more: https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
dependencies {
    testRuntimeOnly('org.opentest4j:opentest4j:1.3.0')
    testImplementation('junit:junit:4.13.2')

    // IntelliJ Platform Gradle Plugin Dependencies Extension - read more: https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-dependencies-extension.html
    intellijPlatform {
        create(platformType, platformVersion)

        // Plugin Dependencies. Uses `platformBundledPlugins` property from the gradle.properties file for bundled IntelliJ Platform plugins.
        bundledPlugins(platformBundledPlugins.split(',').collect { it.trim() })

        // Plugin Dependencies. Uses `platformPlugins` property from the gradle.properties file for plugin from JetBrains Marketplace.
        plugins(platformPlugins.split(',').collect { it.trim() })

        instrumentationTools()
        pluginVerifier()
        testFramework(TestFrameworkType.Platform.INSTANCE)
        testFramework(TestFrameworkType.Plugin.Java.INSTANCE)
    }
}

group = pluginGroup
version = pluginVersion + '-' + platformVersion

// Reason, Rescript, BuckleScript and Esy are no longer registered in plugin.xml, so their tests can no
// longer parse anything - the file types they configure resolve to plain text. The sources and the tests
// are kept, so that re-registering a language in plugin.xml brings its suite back with it.
test {
    exclude 'com/reason/lang/reason/**'
    exclude 'com/reason/lang/rescript/**'
    exclude 'com/reason/lang/doc/reason/**'
    exclude 'com/reason/lang/doc/rescript/**'
    exclude 'com/reason/comp/bs/**'
    exclude 'com/reason/comp/esy/**'
    exclude '**/*_RML_*'
    exclude '**/*_RES_*'
    exclude '**/*RMLTest*'
    exclude '**/*RESTest*'
    // Named one by one: a '**/Res*' pattern also swallows every Resolve*_OCL_Test
    exclude '**/RmlDocConverterTest*'
    exclude '**/RmlParameterInfoHandlerTest*'
    exclude '**/ResConfigReaderTest*'
    exclude '**/ResParameterInfoHandlerTest*'
    exclude '**/Rescript*'
    // only has Reason and Rescript cases
    exclude '**/ORDocumentationProviderTest*'
}

intellijPlatform {
    pluginConfiguration {
        version = pluginVersion + '-' + platformVersion
        ideaVersion {
            sinceBuild = pluginSinceBuild
            untilBuild = pluginUntilBuild
        }
    }

    patchPluginXml {
        sinceBuild = pluginSinceBuild
        untilBuild = pluginUntilBuild
        changeNotes = """
                <p>Personal OCaml-only fork of the ReasonML plugin.</p>
                <ul>
                    <li>Reason, Rescript, BuckleScript and Esy support is no longer registered</li>
                    <li>Opam executable is resolved explicitly and the configured root is honoured</li>
                    <li>Rincewind binaries live outside the plugin directory and are not re-downloaded when unavailable</li>
                    <li>Stdlib resolves through Stdlib rather than the removed Pervasives module</li>
                </ul>
            """.stripIndent()
    }

    pluginVerification {
        ides {
            recommended()
        }
    }
}

runIde {
    systemProperty 'idea.is.internal', true
    jvmArgs '-Xmx2G'
    // MAVEN_CACHE C:\Users\hgiraud\scoop\persist\maven\.m2
    // MAVEN_HOME  C:\Users\hgiraud\scoop\apps\maven\current
    // MAVEN_REPOSITORY C:\Users\hgiraud\scoop\persist\maven\.m2\repository
}
